name: Release

# Tag a version and three machines build it. The macOS job is the only reason macOS can
# ship at all: a .app has to be packaged and signed on a Mac, and GitHub's runners are free
# for public repositories, so the project still costs nothing to release.
on:
  push:
    tags: ['v*']
  # Lets a build be rehearsed against a branch without tagging anything. Produces artefacts
  # and publishes nothing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one platform failing should not deny you the other two
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Everything CI already enforces, again, because a release is the one build where
      # nobody gets a second look at it.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Interface parses
        run: npm run check:ui

      # Regenerated rather than trusted: a notice file that is out of date makes a claim
      # about what is in the build that is no longer true, and this script fails outright
      # on a dependency that cannot be redistributed.
      - name: Third party notices
        run: npm run notices

      - name: Test
        run: npm test

      - name: Build the engine
        run: npm run build

      # Draft, always. The release is assembled by machines and published by a person.
      - name: Package
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  checksums:
    name: checksums
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts

      # Nothing here is signed, so the checksum is the only thing a careful person can use
      # to tell a real download from a tampered one. It has to be attached to the same
      # release as the files it describes.
      - name: Write SHA256SUMS.txt
        run: |
          cd artefacts
          find . -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \
            -o -name '*.AppImage' -o -name '*.deb' \) -print0 \
            | xargs -0 -I{} sh -c 'sha256sum "{}" | sed "s|\./[^/]*/||"' \
            | sort -k2 > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" SHA256SUMS.txt --clobber --repo "${GITHUB_REPOSITORY}"
