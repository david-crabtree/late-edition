name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: typecheck · lint · notices · ui · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The interface is one uncompiled HTML file with an inline script, so nothing else
      # would catch a stray bracket before it shipped as a blank window.
      - name: Interface parses
        run: npm run check:ui

      # A notice file that is out of date makes a claim about what is in the build that is
      # no longer true, and a dependency that cannot be redistributed puts the licence of
      # the whole build in question. Both are cheap here and expensive at release time.
      - name: Third party notices current
        run: npm run check:notices

      - name: Test
        run: npm test

      # A bad electron-builder config is only discovered when something is packaged, and
      # the first thing that packages is a tag — by which point three runners have failed
      # and a release is half made. `--dir` validates the config and packs an unpacked
      # build without producing installers, which is quick and catches exactly that.
      - name: Packaging config is valid
        run: |
          npm run build
          npx electron-builder --dir --publish never
